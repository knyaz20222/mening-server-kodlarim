// Use this file to configure your DEDICATED server. 
// This config file is executed on server start.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name. Change to "Bob's Server", etc.
hostname "Counter-Strike 1.6 Server"

// maximum client movement speed 
sv_maxspeed 320

// 20 minute timelimit
mp_timelimit 20

sv_cheats 0

// load ban files
exec listip.cfg
exec banned.cfg
map de_dust
bot_difficulty 0
// --- Mobil internet uchun engil sozlamalar ---
sys_ticrate 300
sv_maxrate 10000
sv_minrate 5000
sv_maxupdaterate 30
sv_minupdaterate 10
sv_cmdrate 30
sv_cmdbackup 0
sv_dlmax 50
sv_forcepreload 1
// Ping va yuklamani kamaytirish uchun
sv_minrate 7500
sv_maxrate 20000
sv_minupdaterate 20
sv_maxupdaterate 101

// Serverni yengillashtirish
mp_decals 50
sv_maxspeed 320
// FastDL sozlamalari
sv_allowdownload 1
sv_allowupload 1
sv_downloadurl "https://raw.githubusercontent.com/knyaz20222/mening-server-kodlarim/main/"
